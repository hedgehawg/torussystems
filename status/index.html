<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Operations · Torus Systems</title>
<meta name="description" content="View-only ForecastEx operations status.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23101820'/%3E%3Cellipse cx='50' cy='54' rx='40' ry='23' fill='none' stroke='%23eef1f5' stroke-width='6'/%3E%3Cellipse cx='50' cy='45' rx='15.5' ry='7.5' fill='none' stroke='%23eef1f5' stroke-width='6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="status.css">
</head>
<body>
<header>
  <div class="wrap">
    <nav>
      <a class="brand" href="../">
        <img src="../assets/torus-mark.svg" alt="">
        Torus Systems
      </a>
      <div class="nav-side" id="nav-side" hidden>
        <span class="nav-hint">View only</span>
        <button type="button" class="text-btn" id="refresh-btn">Refresh</button>
        <button type="button" class="text-btn" id="lock-btn">Lock</button>
      </div>
    </nav>
  </div>
</header>

<main id="gate" class="gate">
  <div class="wrap gate-inner">
    <img class="mark" src="../assets/torus-mark.svg" alt="">
    <p class="kicker">ForecastEx</p>
    <h1>Operations</h1>
    <div class="rule"></div>
    <p class="lede">Contracted book · read only</p>
    <form id="unlock-form" class="unlock" autocomplete="off">
      <label class="sr-only" for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password" required>
      <button type="submit" class="apply-btn">Unlock</button>
      <p class="form-error" id="unlock-error" hidden>That password does not match.</p>
    </form>
  </div>
</main>

<main id="dash" class="dash" hidden>
  <div class="wrap">
    <div class="page-head">
      <p class="kicker">ForecastEx · econ book</p>
      <h1>Operations</h1>
      <p class="lede" id="feed-stamp">Awaiting feed</p>
    </div>

    <section class="book" id="book" aria-live="polite">
      <div class="book-top">
        <div>
          <p class="kicker">Book</p>
          <p class="book-state" id="book-state">—</p>
        </div>
        <div class="book-meta" id="book-meta"></div>
      </div>
    </section>

    <p class="sample-banner" id="sample-banner" hidden>Sample feed — replace <code>status/data.json</code> from the Dell publisher.</p>
    <p class="feed-error" id="feed-error" hidden></p>

    <section class="products" id="products" aria-label="Product status"></section>
  </div>
</main>

<footer>
  <div class="wrap">&copy; Torus Systems LLC &middot; New York<br>View only. No trading controls.</div>
</footer>

<script src="config.js"></script>
<script src="status.js"></script>
</body>
</html>
